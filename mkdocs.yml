site_name: AI VAT Number Validation
site_url: https://iwebdevnl.github.io/ai-vat-number-validation/
theme:
  name: material
  palette:
    - scheme: default
      toggle: { icon: material/weather-night, name: Dark }
    - scheme: slate
      toggle: { icon: material/weather-sunny, name: Light }
nav:
  - Home: index.md
  - Architecture: architecture.md
  - Example prompts: prompts.md
  - Clients:
      - Claude: clients/claude.md
      - ChatGPT: clients/chatgpt.md
      - Cursor: clients/cursor.md
      - VS Code (GitHub Copilot): clients/vscode.md
      - Cline: clients/cline.md
      - Windsurf: clients/windsurf.md
      - Zed: clients/zed.md
      - Perplexity: clients/perplexity.md
      - Microsoft Copilot Studio: clients/copilot-studio.md
  - Reading the result: reading-the-result.md
  - Monthly allowance: limits.md
  - FAQ: faq.md
  - Security & privacy: security-and-privacy.md
  - Product page: https://www.iwebdevelopment.com/btw-nummer-validator
markdown_extensions:
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
